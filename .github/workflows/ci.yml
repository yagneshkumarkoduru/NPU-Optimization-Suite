name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pyyaml

      - name: Bytecode Syntax Compilation Check
        run: |
          python -m compileall implementations/ unified_pipeline/

      - name: Run Tier 1 Polyhedral Tiling Engine
        run: |
          python implementations/v1_polyhedral_loop_tiling/polyhedral_tiling_engine.py

      - name: Run Tier 2 Roofline Double-Buffering Engine
        run: |
          python implementations/v2_roofline_dma_double_buffering/roofline_double_buffering_engine.py

      - name: Run Tier 3 UCIe Chiplet & Speculative Pass
        run: |
          python implementations/v3_ucie_chiplet_speculative_decoding/chiplet_speculative_compiler.py
